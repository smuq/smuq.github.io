<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Interface - Steam Style</title>
    <!-- Подключаем Google Identity Services (вход через Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --steam-bg: #1b2838;
            --steam-header: #171a21;
            --steam-content: #2a475e;
            --steam-text: #c7d5e0;
            --steam-blue: #66c0f4;
            --steam-green: #5c7e10;
            --steam-green-hover: #4c6b22;
            --qwen-color: #ff9d00;
            --deepseek-color: #007bff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
            background-color: var(--steam-bg);
            color: var(--steam-text);
            background-image: linear-gradient(to bottom, #1b2838 0%, #2a475e 100%);
            min-height: 100vh;
            /* Мобильные улучшения */
            -webkit-text-size-adjust: 100%; /* запрещает авто-увеличение текста iOS */
            -webkit-tap-highlight-color: transparent;
            text-rendering: optimizeLegibility;
        }

        /* Убираем задержку/зум двойным касанием на тач-устройствах */
        button,
        textarea {
            touch-action: manipulation;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Auth */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--steam-text);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .auth-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-auth {
            background: linear-gradient( to bottom, #47bfff 5%, #1a44c2 60%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .btn-auth:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        .btn-auth.qwen { background: linear-gradient( to bottom, #ffbf47 5%, #c25c1a 60%); }
        .btn-auth.deepseek { background: linear-gradient( to bottom, #478aff 5%, #1a2cc2 60%); }

        /* Кнопка модели, в которую уже вошли */
        .btn-auth:disabled {
            cursor: default;
            opacity: 0.75;
            filter: saturate(0.7);
            transform: none;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid var(--steam-blue);
        }

        /* Сообщение о статусе/ошибке авторизации */
        .auth-message {
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
            color: #ffcf7d;
            background: rgba(255, 157, 0, 0.12);
            border: 1px solid rgba(255, 157, 0, 0.35);
            padding: 8px 12px;
            border-radius: 4px;
            box-sizing: border-box;
            flex-basis: 100%; /* в flex-шапке занимает всю строку */
            margin-top: 2px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
            box-shadow: 0 0 5px #ccc;
        }
        .status-dot.active {
            background-color: #a4d007;
            box-shadow: 0 0 8px #a4d007;
        }

        /* Inputs */
        .input-section {
            margin-bottom: 30px;
        }

        .model-input-group {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #ccc;
            position: relative;
        }

        .model-input-group.qwen { border-left-color: var(--qwen-color); }
        .model-input-group.deepseek { border-left-color: var(--deepseek-color); }
        .model-input-group.shared { border-left-color: var(--steam-blue); }

        .model-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 3px;
            color: #1b2838;
            font-weight: bold;
        }
        .badge.qwen { background-color: var(--qwen-color); }
        .badge.deepseek { background-color: var(--deepseek-color); color: white; }
        .badge.shared { background-color: var(--steam-blue); color: #1b2838; }

        textarea {
            width: 100%;
            height: 80px;
            background: #101820;
            border: 1px solid #3a4b5e;
            color: white;
            padding: 10px;
            border-radius: 3px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--steam-blue);
            box-shadow: 0 0 10px rgba(102, 192, 244, 0.2);
        }

        /* Action Button */
        .action-area {
            text-align: center;
            margin: 40px 0;
        }

        .btn-submit {
            background: linear-gradient( to bottom, #a4d007 5%, #536904 95%);
            color: #d4e9a8;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 0 10px rgba(164, 208, 7, 0.3);
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: linear-gradient( to bottom, #b6e018 5%, #6b8505 95%);
            color: #fff;
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            background: #3a4b5e;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Outputs */
        .output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .output-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; }
            .auth-container { width: 100%; justify-content: space-between; }
        }

        .response-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #3a4b5e;
            border-radius: 5px;
            padding: 20px;
            min-height: 200px;
            position: relative;
        }

        .response-card h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            font-size: 16px;
        }

        .response-content {
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--steam-blue);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .repo-link {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #555;
        }
        .repo-link a { color: var(--steam-blue); text-decoration: none; }
/* ==========================================
           МОБИЛЬНАЯ ВЕРСИЯ (до 768px)
           Правила размещены в конце, чтобы
           гарантированно перекрывать базовые стили.
           ========================================== */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
                padding-bottom: 112px; /* место под фиксированную кнопку */
            }

            /* Шапка — колонкой по центру */
            header {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding-bottom: 14px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 18px;
                text-align: center;
                letter-spacing: 0.5px;
            }

            /* Кнопки входа — 2 в ряд на всю ширину */
            .auth-container {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                justify-content: stretch;
            }

            .btn-auth {
                width: 100%;
                justify-content: center;
                padding: 12px 6px;
                font-size: 13px;
                min-height: 44px; /* удобная область касания */
                box-sizing: border-box;
                white-space: nowrap;
            }

            /* Статус пользователя — на всю ширину */
            .user-status {
                justify-content: center;
                padding: 10px 12px;
                width: 100%;
                box-sizing: border-box;
            }

            /* Сообщение авторизации — на всю ширину (обе колонки) */
            .auth-message {
                grid-column: 1 / -1;
            }

            .model-input-group {
                padding: 14px;
            }

            .model-label {
                font-size: 16px;
            }

            textarea {
                /* 16px — запрещает автоматический зум iOS при фокусе */
                font-size: 16px;
                min-height: 90px;
                padding: 12px;
            }

            /* Кнопка отправки — фиксированная панель снизу */
            .action-area {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 100;
                margin: 0;
                padding: 10px 12px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
                background: rgba(23, 26, 33, 0.92);
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            .btn-submit {
                width: 100%;
                margin: 0;
                padding: 14px 12px;
                font-size: 15px;
                line-height: 1.3;
                white-space: normal;
                min-height: 48px;
            }

            /* Ответы — в одну колонку */
            .output-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .response-card {
                min-height: 120px;
                padding: 14px;
            }

            .response-content {
                font-size: 14px;
            }

            .repo-link {
                margin-top: 24px;
            }
        }

        /* Очень маленькие телефоны (<420px) */
        @media (max-width: 420px) {
            h1 { font-size: 16px; }
            .auth-container { gap: 8px; }
            .btn-auth { font-size: 12px; padding: 12px 4px; }
            .model-input-group { padding: 12px; }
        }

        /* На тач-устройствах не «прилипают» hover-эффекты */
        @media (hover: none) {
            .btn-auth:hover,
            .btn-submit:hover {
                transform: none;
                filter: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 AI Neural Interface</h1>
        
        <div class="auth-container">
            <!-- Кнопки входа -->
            <button id="btnLoginQwen" class="btn-auth qwen" onclick="handleLogin('qwen')">
                🔐 Qwen Вход
            </button>
            <button id="btnLoginDeepSeek" class="btn-auth deepseek" onclick="handleLogin('deepseek')">
                🔐 DeepSeek Вход
            </button>

            <!-- Статус пользователя (скрыт по умолчанию) -->
            <div id="userStatus" class="user-status" style="display: none;">
                <div class="status-dot" id="statusDot"></div>
                <span id="userName">User</span>
                <button onclick="handleLogout()" style="background:none; border:none; color:#aaa; cursor:pointer; margin-left:10px;">✕</button>
            </div>

            <!-- Сообщение об ошибке/статусе авторизации -->
            <div id="authMessage" class="auth-message" style="display: none;"></div>
        </div>
    </header>

    <!-- Секция ввода -->
    <div class="input-section">
        <div class="model-input-group shared">
            <div class="model-label">
                <span class="badge shared">ЗАПРОС</span>
                Один запрос — обеим моделям
            </div>
            <textarea id="inputQuery" placeholder="Введите сообщение — оно уйдёт и Qwen, и DeepSeek (Enter для отправки)"></textarea>
        </div>
    </div>

    <!-- Кнопка действия -->
    <div class="action-area">
        <button id="btnSubmit" class="btn-submit" onclick="sendRequests()">
            Отправить обоим моделям
        </button>
    </div>

    <!-- Секция вывода -->
    <div class="output-grid">
        <div class="response-card">
            <h3><span class="badge qwen">QWEN</span> Ответ</h3>
            <div class="response-content" id="outputQwen">
                <span class="loading-spinner" id="spinnerQwen"></span>
                <span id="textQwen">Ожидание запроса...</span>
            </div>
        </div>

        <div class="response-card">
            <h3><span class="badge deepseek">DEEPSEEK</span> Ответ</h3>
            <div class="response-content" id="outputDeepSeek">
                <span class="loading-spinner" id="spinnerDeepSeek"></span>
                <span id="textDeepSeek">Ожидание запроса...</span>
            </div>
        </div>
    </div>

    <div class="repo-link">
        Приватный репозиторий: <a href="https://github.com/smuq/smuq.github.io" target="_blank">GitHub Repo</a>
    </div>
</div>

<script>
    // ==========================================
    // НАСТРОЙКИ GOOGLE (Google Identity Services)
    // ==========================================
    // КАК ПОЛУЧИТЬ OAuth CLIENT ID (2 минуты):
    // 1) Откройте https://console.cloud.google.com/apis/credentials
    // 2) Кнопка «+ СОЗДАТЬ УЧЁТНЫЕ ДАННЫЕ» → «Идентификатор клиента OAuth»
    // 3) Тип приложения: «Веб-приложение»
    //    Разрешённые источники JavaScript (Authorized JS origins):
    //      https://smuq.github.io
    //      http://localhost:5500      ← для локального теста (Live Server)
    //      http://127.0.0.1:5500
    // 4) Скопируйте «Идентификатор клиента» (xxxx.apps.googleusercontent.com) сюда:
    const GOOGLE_CLIENT_ID = "626144127809-bo39dfq66vsibuan0pq4qp1cgmu8uo1p.apps.googleusercontent.com";

    // ==========================================
    // Состояние авторизации
    // ==========================================
    let tokenClient = null;
    let accessToken = null;
    let currentUser = null;
    let activeModel = null; // Какая модель была выбрана для входа
    let loginState = { qwen: false, deepseek: false }; // вход отдельно для каждой модели

    // ==========================================
    // Инициализация Google Identity Services
    // ==========================================
    function initGoogleAuth() {
        if (GOOGLE_CLIENT_ID.indexOf("ВАШ_") !== -1) {
            showAuthMessage("⚠️ Google ещё не настроен: вставьте свой OAuth Client ID в код (строка GOOGLE_CLIENT_ID). Инструкция — в комментарии выше.");
            return false;
        }
        if (typeof google === "undefined" || !google.accounts || !google.accounts.oauth2) {
            showAuthMessage("⚠️ Библиотека Google не загрузилась. Проверьте интернет-соединение и обновите страницу.");
            return false;
        }

        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: "https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile",
            prompt: "select_account", // всегда показываем выбор аккаунта
            callback: handleTokenResponse,
            error_callback: handleTokenError
        });
        return true;
    }

    // ==========================================
    // Ответ от Google с токеном
    // ==========================================
    function handleTokenResponse(resp) {
        if (!resp || resp.error) {
            const desc = resp && (resp.error_description || resp.error);
            showAuthMessage("⚠️ Ошибка авторизации: " + (desc || "неизвестная ошибка"));
            return;
        }
        accessToken = resp.access_token;

        // Получаем адрес почты через Google API
        fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + accessToken }
        })
            .then(r => r.json())
            .then(info => {
                if (info.error) throw new Error(info.error.message || "не удалось получить профиль");
                const user = { email: info.email || "unknown", name: info.name || "" };
                currentUser = user;
                loginState[activeModel] = true; // отмечаем вход именно в эту модель
                localStorage.setItem("ai_google_user", JSON.stringify(user));
                localStorage.setItem("ai_google_models", JSON.stringify(loginState));
                hideAuthMessage();
                updateUI(user);
                console.log("Успешный вход через Google (" + activeModel + ") → " + user.email);
            })
            .catch(err => showAuthMessage("⚠️ Не удалось получить данные профиля: " + err.message));
    }

    function handleTokenError(err) {
        let msg = (err && (err.message || err.type || err.error_description)) || "";
        if (err && err.type === "popup_closed") {
            msg = "Окно Google было закрыто без выбора аккаунта.";
        } else if (err && err.type === "popup_blocked") {
            msg = "Браузер заблокировал всплывающее окно. Разрешите его для этого сайта.";
        } else if (err && (err.error === "origin_mismatch" || (msg + "").indexOf("origin") !== -1)) {
            msg = "Этот домен не добавлен в «Разрешённые источники JavaScript» в Google Cloud Console.";
        } else if (!msg) {
            msg = "что-то пошло не так. Подробности в консоли браузера (F12).";
        }
        showAuthMessage("⚠️ Ошибка входа Google: " + msg);
    }

    // Восстанавливаем последнего пользователя после обновления страницы
    function restoreSession() {
        try {
            const saved = JSON.parse(localStorage.getItem("ai_google_user") || "null");
            if (saved && saved.email) {
                currentUser = saved;
                const models = JSON.parse(localStorage.getItem("ai_google_models") || "{}");
                loginState.qwen = !!models.qwen;
                loginState.deepseek = !!models.deepseek;
                updateUI(saved);
            }
        } catch (e) { /* повреждённые данные localStorage — игнорируем */ }
    }

    // ==========================================
    // Вход / выход
    // ==========================================
    function handleLogin(model) {
        if (loginState[model]) return; // в эту модель уже вошли
        activeModel = model;
        hideAuthMessage();

        if (!initGoogleAuth()) return;
        // Открываем окно выбора Google-аккаунта
        tokenClient.requestAccessToken();
    }

    function handleLogout() {
        if (accessToken && typeof google !== "undefined" && google.accounts) {
            try { google.accounts.oauth2.revoke(accessToken, function(){}); } catch (e) {}
        }
        accessToken = null;
        currentUser = null;
        loginState = { qwen: false, deepseek: false };
        localStorage.removeItem("ai_google_user");
        localStorage.removeItem("ai_google_models");
        updateUI(null);
        showAuthMessage("Вы вышли из аккаунта. 🔓");
    }

    // ==========================================
    // Интерфейс
    // ==========================================
    function updateUI(user) {
        const statusDiv = document.getElementById('userStatus');
        const nameSpan = document.getElementById('userName');
        const dot = document.getElementById('statusDot');
        const btnQwen = document.getElementById('btnLoginQwen');
        const btnDeepSeek = document.getElementById('btnLoginDeepSeek');

        const loggedInAny = loginState.qwen || loginState.deepseek;

        if (user && loggedInAny) {
            statusDiv.style.display = 'flex';
            nameSpan.textContent = user.email.split('@')[0];
            if (!dot.classList.contains('active')) dot.classList.add('active');
        } else {
            statusDiv.style.display = 'none';
            dot.classList.remove('active');
        }

        // Кнопки входа — по каждой модели отдельно
        updateLoginButton(btnQwen, 'Qwen', loginState.qwen);
        updateLoginButton(btnDeepSeek, 'DeepSeek', loginState.deepseek);
    }

    function updateLoginButton(btn, name, loggedIn) {
        btn.style.display = 'flex';
        btn.disabled = loggedIn;
        btn.textContent = loggedIn ? "✓ " + name : "🔐 " + name + " Вход";
    }

    function showAuthMessage(text) {
        const el = document.getElementById('authMessage');
        if (!el) return;
        el.textContent = text;
        el.style.display = text ? 'block' : 'none';
    }

    function hideAuthMessage() {
        const el = document.getElementById('authMessage');
        if (el) el.style.display = 'none';
    }

    // Запуск при загрузке страницы
    restoreSession();

    // ==========================================
    // НАСТРОЙКИ AI-API (реальные ответы моделей)
    // ==========================================
    // Qwen: API-ключ DashScope (Compatible Mode) вида sk-...
    // Получить: https://bailian.console.aliyun.com → «API-KEY» → создать ключ
    const QWEN_API_KEY = "ВАШ_КЛЮЧ_QWEN";

    // DeepSeek: API-ключ вида sk-...
    // Получить: https://platform.deepseek.com → «API Keys» → создать ключ
    const DEEPSEEK_API_KEY = "ВАШ_КЛЮЧ_DEEPSEEK";

    // Запрос к Qwen (DashScope, OpenAI-совместимый формат)
    async function askQwen(prompt) {
        if (QWEN_API_KEY.indexOf("ВАШ_") !== -1) {
            return '[Qwen Demo]\nПолучен ваш запрос: "' + prompt + '"\n\n(Для реальных ответов вставьте API-ключ Qwen — константа QWEN_API_KEY в коде)';
        }
        const res = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + QWEN_API_KEY
            },
            body: JSON.stringify({
                model: "qwen-plus",
                messages: [{ role: "user", content: prompt }]
            })
        });
        if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()).slice(0, 200));
        const data = await res.json();
        const text = data.choices && data.choices[0] && data.choices[0].message
            ? data.choices[0].message.content
            : "";
        return text || "Пустой ответ от Qwen";
    }

    // Запрос к DeepSeek (OpenAI-совместимый формат)
    async function askDeepSeek(prompt) {
        if (DEEPSEEK_API_KEY.indexOf("ВАШ_") !== -1) {
            return '[DeepSeek Demo]\nПолучен ваш запрос: "' + prompt + '"\n\n(Для реальных ответов вставьте API-ключ DeepSeek — константа DEEPSEEK_API_KEY в коде)';
        }
        const res = await fetch("https://api.deepseek.com/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + DEEPSEEK_API_KEY
            },
            body: JSON.stringify({
                model: "deepseek-chat",
                messages: [{ role: "user", content: prompt }]
            })
        });
        if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()).slice(0, 200));
        const data = await res.json();
        const text = data.choices && data.choices[0] && data.choices[0].message
            ? data.choices[0].message.content
            : "";
        return text || "Пустой ответ от DeepSeek";
    }

    // ==========================================
    // Отправка одного запроса обеим моделям
    // ==========================================
    async function sendRequests() {
        const query = document.getElementById('inputQuery').value.trim();
        const outQ = document.getElementById('textQwen');
        const outD = document.getElementById('textDeepSeek');
        const spinQ = document.getElementById('spinnerQwen');
        const spinD = document.getElementById('spinnerDeepSeek');
        const btn = document.getElementById('btnSubmit');

        if (!query) {
            alert("Введите запрос!");
            return;
        }

        // Блокируем кнопку и запускаем обе модели параллельно
        btn.disabled = true;
        btn.textContent = "Спрашиваю обе модели...";
        spinQ.style.display = 'inline-block';
        spinD.style.display = 'inline-block';
        outQ.textContent = "Qwen думает...";
        outD.textContent = "DeepSeek думает...";

        const [answerQ, answerD] = await Promise.all([
            askQwen(query).catch(err => "[Ошибка Qwen]: " + err.message),
            askDeepSeek(query).catch(err => "[Ошибка DeepSeek]: " + err.message)
        ]);

        spinQ.style.display = 'none';
        spinD.style.display = 'none';
        outQ.textContent = answerQ;
        outD.textContent = answerD;

        btn.disabled = false;
        btn.textContent = "Отправить обоим моделям";
    }

    // Отправка по Enter
    document.getElementById('inputQuery').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendRequests();
        }
    });
</script>
