<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Neural Interface - Steam Style</title>
    <style>
        :root {
            --steam-bg: #1b2838;
            --steam-header: #171a21;
            --steam-card: #2a475e;
            --steam-text: #c7d5e0;
            --steam-blue: #66c0f4;
            --steam-green: #5c7e10;
            --steam-green-hover: #4c6b0d;
            --qwen-color: #ff9d00;
            --deepseek-color: #0052cc;
        }

        body {
            background-color: var(--steam-bg);
            color: var(--steam-text);
            font-family: "Motiva Sans", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header & Auth */
        header {
            width: 100%;
            background: linear-gradient(to right, #0f1215, #1b2838);
            padding: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            border-bottom: 2px solid var(--steam-blue);
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
        }

        .auth-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .auth-btn {
            background: linear-gradient(to bottom, #4a90d9, #2a5a8a);
            border: none;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            text-decoration: none;
        }

        .auth-btn.qwen { border-bottom: 2px solid var(--qwen-color); }
        .auth-btn.deepseek { border-bottom: 2px solid var(--deepseek-color); }

        .auth-btn:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #555;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .status-dot.connected {
            background-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        /* Main Content */
        main {
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
            flex-grow: 1;
        }

        .input-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3a5c7a;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--steam-blue);
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        .badge-qwen { background-color: var(--qwen-color); }
        .badge-deepseek { background-color: var(--deepseek-color); }

        textarea {
            width: 100%;
            background: #151d25;
            border: 1px solid #3a5c7a;
            color: #fff;
            padding: 15px;
            border-radius: 4px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--steam-blue);
            box-shadow: 0 0 10px rgba(102, 192, 244, 0.3);
        }

        .submit-btn {
            background: linear-gradient(to bottom, #a4d007, #5c7e10);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: linear-gradient(to bottom, #b8e608, #6a9112);
            transform: scale(1.01);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* Output Section */
        .output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .output-grid {
                grid-template-columns: 1fr;
            }
        }

        .output-card {
            background: var(--steam-card);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .card-content {
            padding: 20px;
            min-height: 200px;
            color: #dbe2e8;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            color: var(--steam-blue);
            font-style: italic;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #556;
            border-top: 1px solid #333;
            width: 100%;
        }
        
        a.repo-link {
            color: var(--steam-blue);
            text-decoration: none;
        }
        a.repo-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <h1>Neural Network Interface</h1>
    <div class="auth-container">
        <button class="auth-btn qwen" onclick="alert('Форма авторизации Qwen (Email) будет здесь')">
            <span class="status-dot" id="status-qwen"></span>
            🔐 Qwen Авторизация
        </button>
        <button class="auth-btn deepseek" onclick="alert('Форма авторизации DeepSeek (Email) будет здесь')">
            <span class="status-dot" id="status-deepseek"></span>
            🔐 DeepSeek Авторизация
        </button>
    </div>
</header>

<main>
    <!-- Input Section -->
    <div class="input-section">
        <div class="input-group">
            <label class="input-label">
                <span class="badge badge-qwen">QWEN</span>
                Введите запрос:
            </label>
            <textarea id="input-qwen" placeholder="Введите сообщение для модели Qwen..."></textarea>
        </div>

        <div class="input-group">
            <label class="input-label">
                <span class="badge badge-deepseek">DEEPSEEK</span>
                Введите запрос:
            </label>
            <textarea id="input-deepseek" placeholder="Введите сообщение для модели DeepSeek..."></textarea>
        </div>

        <button class="submit-btn" onclick="sendRequests()">
            ОТПРАВИТЬ ОБОИМ МОДЕЛЯМ
        </button>
    </div>

    <!-- Output Section -->
    <div class="output-grid">
        <div class="output-card">
            <div class="card-header">
                <span><span class="badge badge-qwen">QWEN</span> Ответ</span>
                <span id="loader-qwen" style="display:none; font-size:12px;">⏳ Загрузка...</span>
            </div>
            <div class="card-content" id="output-qwen">
                Ожидание запроса...
            </div>
        </div>

        <div class="output-card">
            <div class="card-header">
                <span><span class="badge badge-deepseek">DEEPSEEK</span> Ответ</span>
                <span id="loader-deepseek" style="display:none; font-size:12px;">⏳ Загрузка...</span>
            </div>
            <div class="card-content" id="output-deepseek">
                Ожидание запроса...
            </div>
        </div>
    </div>
</main>

<footer>
    <p>Приватный доступ через репозиторий: <a href="https://github.com/smuq/smuq.github.io" target="_blank" class="repo-link">smuq.github.io</a></p>
    <p>&copy; 2024 AI Interface. Steam Design Concept.</p>
</footer>

<script>
    // Функция имитации отправки (так как реальные API ключи нельзя хранить в публичном коде)
    async function sendRequests() {
        const inputQwen = document.getElementById('input-qwen').value;
        const inputDeepSeek = document.getElementById('input-deepseek').value;
        
        const outputQwen = document.getElementById('output-qwen');
        const outputDeepSeek = document.getElementById('output-deepseek');
        
        const loaderQwen = document.getElementById('loader-qwen');
        const loaderDeepSeek = document.getElementById('loader-deepseek');

        if (!inputQwen && !inputDeepSeek) {
            alert("Пожалуйста, введите хотя бы один запрос.");
            return;
        }

        // Имитация загрузки
        if (inputQwen) {
            outputQwen.innerHTML = '<span class="loading">Генерация ответа...</span>';
            loaderQwen.style.display = 'inline';
        }
        if (inputDeepSeek) {
            outputDeepSeek.innerHTML = '<span class="loading">Генерация ответа...</span>';
            loaderDeepSeek.style.display = 'inline';
        }

        // Симуляция задержки сети
        setTimeout(() => {
            if (inputQwen) {
                loaderQwen.style.display = 'none';
                outputQwen.innerText = `[Qwen Demo]:\nПолучен запрос: "${inputQwen}"\n\nЭто демонстрационный ответ. Для реальной работы необходимо подключить API в коде.`;
                // Анимация мигания статуса при успехе
                blinkStatus('status-qwen');
            }
            
            if (inputDeepSeek) {
                loaderDeepSeek.style.display = 'none';
                outputDeepSeek.innerText = `[DeepSeek Demo]:\nПолучен запрос: "${inputDeepSeek}"\n\nЭто демонстрационный ответ. Для реальной работы необходимо подключить API в коде.`;
                blinkStatus('status-deepseek');
            }
        }, 1500);
    }

    function blinkStatus(id) {
        const dot = document.getElementById(id);
        dot.classList.add('connected');
        setTimeout(() => dot.classList.remove('connected'), 1000);
    }

    // Отправка по Enter (если не нажат Shift)
    document.querySelectorAll('textarea').forEach(area => {
        area.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendRequests();
            }
        });
    });
</script>

</body>
</html>
