<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interface - Steam Style</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --steam-bg: #1b2838;
            --steam-header: #171a21;
            --steam-content: #2a475e;
            --steam-text: #c7d5e0;
            --steam-blue: #66c0f4;
            --steam-green: #5c7e10;
            --steam-green-hover: #4c6b22;
            --qwen-color: #ff9d00;
            --deepseek-color: #007bff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
            background-color: var(--steam-bg);
            color: var(--steam-text);
            background-image: linear-gradient(to bottom, #1b2838 0%, #2a475e 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Auth */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--steam-text);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .auth-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-auth {
            background: linear-gradient( to bottom, #47bfff 5%, #1a44c2 60%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .btn-auth:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        .btn-auth.qwen { background: linear-gradient( to bottom, #ffbf47 5%, #c25c1a 60%); }
        .btn-auth.deepseek { background: linear-gradient( to bottom, #478aff 5%, #1a2cc2 60%); }

        .user-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid var(--steam-blue);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
            box-shadow: 0 0 5px #ccc;
        }
        .status-dot.active {
            background-color: #a4d007;
            box-shadow: 0 0 8px #a4d007;
        }

        /* Inputs */
        .input-section {
            margin-bottom: 30px;
        }

        .model-input-group {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #ccc;
            position: relative;
        }

        .model-input-group.qwen { border-left-color: var(--qwen-color); }
        .model-input-group.deepseek { border-left-color: var(--deepseek-color); }

        .model-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 3px;
            color: #1b2838;
            font-weight: bold;
        }
        .badge.qwen { background-color: var(--qwen-color); }
        .badge.deepseek { background-color: var(--deepseek-color); color: white; }

        textarea {
            width: 100%;
            height: 80px;
            background: #101820;
            border: 1px solid #3a4b5e;
            color: white;
            padding: 10px;
            border-radius: 3px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--steam-blue);
            box-shadow: 0 0 10px rgba(102, 192, 244, 0.2);
        }

        /* Action Button */
        .action-area {
            text-align: center;
            margin: 40px 0;
        }

        .btn-submit {
            background: linear-gradient( to bottom, #a4d007 5%, #536904 95%);
            color: #d4e9a8;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 0 10px rgba(164, 208, 7, 0.3);
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: linear-gradient( to bottom, #b6e018 5%, #6b8505 95%);
            color: #fff;
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            background: #3a4b5e;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Outputs */
        .output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .output-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; }
            .auth-container { width: 100%; justify-content: space-between; }
        }

        .response-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #3a4b5e;
            border-radius: 5px;
            padding: 20px;
            min-height: 200px;
            position: relative;
        }

        .response-card h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            font-size: 16px;
        }

        .response-content {
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--steam-blue);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .repo-link {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #555;
        }
        .repo-link a { color: var(--steam-blue); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 AI Neural Interface</h1>
        
        <div class="auth-container">
            <!-- Кнопки входа -->
            <button id="btnLoginQwen" class="btn-auth qwen" onclick="handleLogin('qwen')">
                🔐 Qwen Вход
            </button>
            <button id="btnLoginDeepSeek" class="btn-auth deepseek" onclick="handleLogin('deepseek')">
                🔐 DeepSeek Вход
            </button>

            <!-- Статус пользователя (скрыт по умолчанию) -->
            <div id="userStatus" class="user-status" style="display: none;">
                <div class="status-dot" id="statusDot"></div>
                <span id="userName">User</span>
                <button onclick="handleLogout()" style="background:none; border:none; color:#aaa; cursor:pointer; margin-left:10px;">✕</button>
            </div>
        </div>
    </header>

    <!-- Секция ввода -->
    <div class="input-section">
        <div class="model-input-group qwen">
            <div class="model-label">
                <span class="badge qwen">QWEN</span>
                Введите запрос
            </div>
            <textarea id="inputQwen" placeholder="Введите сообщение для Qwen... (Enter для отправки)"></textarea>
        </div>

        <div class="model-input-group deepseek">
            <div class="model-label">
                <span class="badge deepseek">DEEPSEEK</span>
                Введите запрос
            </div>
            <textarea id="inputDeepSeek" placeholder="Введите сообщение для DeepSeek... (Enter для отправки)"></textarea>
        </div>
    </div>

    <!-- Кнопка действия -->
    <div class="action-area">
        <button id="btnSubmit" class="btn-submit" onclick="sendRequests()">
            Отправить обоим моделям
        </button>
    </div>

    <!-- Секция вывода -->
    <div class="output-grid">
        <div class="response-card">
            <h3><span class="badge qwen">QWEN</span> Ответ</h3>
            <div class="response-content" id="outputQwen">
                <span class="loading-spinner" id="spinnerQwen"></span>
                <span id="textQwen">Ожидание запроса...</span>
            </div>
        </div>

        <div class="response-card">
            <h3><span class="badge deepseek">DEEPSEEK</span> Ответ</h3>
            <div class="response-content" id="outputDeepSeek">
                <span class="loading-spinner" id="spinnerDeepSeek"></span>
                <span id="textDeepSeek">Ожидание запроса...</span>
            </div>
        </div>
    </div>

    <div class="repo-link">
        Приватный репозиторий: <a href="https://github.com/smuq/smuq.github.io" target="_blank">GitHub Repo</a>
    </div>
</div>

<script>
    // ==========================================
    // НАСТРОЙКИ FIREBASE (ЗАПОЛНИТЕ ЭТИ ДАННЫЕ)
    // ==========================================
    const firebaseConfig = {
        apiKey: "7be45a05a826eaf1be65acb0e2c726d1e3d508e1",
        authDomain: "ВАШ_PROJECT_ID.firebaseapp.com",
        projectId: "ВАШ_PROJECT_ID",
        storageBucket: "ВАШ_PROJECT_ID.appspot.com",
        messagingSenderId: "ВАШ_SENDER_ID",
        appId: "ВАШ_APP_ID"
    };

    // Инициализация Firebas
    let auth;
    try {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        console.log("Firebase initialized");
    } catch (e) {
        console.error("Ошибка инициализации Firebase. Проверьте конфиг.", e);
        alert("Ошибка настройки авторизации. См. консоль браузера.");
    }

    let currentUser = null;
    let activeModel = null; // Какую модель выбираем для входа

    // Слушатель состояния авторизации
    if (auth) {
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            updateUI(user);
        });
    }

    function updateUI(user) {
        const statusDiv = document.getElementById('userStatus');
        const nameSpan = document.getElementById('userName');
        const dot = document.getElementById('statusDot');
        const btnQwen = document.getElementById('btnLoginQwen');
        const btnDeepSeek = document.getElementById('btnLoginDeepSeek');

        if (user) {
            statusDiv.style.display = 'flex';
            nameSpan.textContent = user.email.split('@')[0];
            dot.classList.add('active');
            
            // Скрываем кнопки входа, если уже вошли
            btnQwen.style.display = 'none';
            btnDeepSeek.style.display = 'none';
        } else {
            statusDiv.style.display = 'none';
            // Показываем кнопки снова
            btnQwen.style.display = 'flex';
            btnDeepSeek.style.display = 'flex';
        }
    }

    function handleLogin(model) {
        if (!auth) {
            alert("Firebase еще не настроен! Добавьте конфигурацию в код.");
            return;
        }
        activeModel = model;
        
        const provider = new firebase.auth.GoogleAuthProvider();
        // Добавляем подсказку, чтобы окно не блокировалось
        provider.setCustomParameters({
            prompt: 'select_account'
        });

        auth.signInWithPopup(provider)
            .then((result) => {
                console.log(`Успешный вход через ${model}`, result.user);
                // Здесь можно сохранить токен для последующих запросов к API нейросети
                localStorage.setItem('ai_auth_token', result.credential.accessToken);
            }).catch((error) => {
                console.error("Ошибка входа:", error);
                alert("Ошибка авторизации: " + error.message);
            });
    }

    function handleLogout() {
        if (auth) {
            auth.signOut().then(() => {
                localStorage.removeItem('ai_auth_token');
                console.log("Выход выполнен");
            });
        }
    }

    // Логика отправки запросов
    async function sendRequests() {
        const inputQ = document.getElementById('inputQwen').value;
        const inputD = document.getElementById('inputDeepSeek').value;
        const outQ = document.getElementById('textQwen');
        const outD = document.getElementById('textDeepSeek');
        const spinQ = document.getElementById('spinnerQwen');
        const spinD = document.getElementById('spinnerDeepSeek');
        const btn = document.getElementById('btnSubmit');

        if (!inputQ && !inputD) {
            alert("Введите хотя бы один запрос!");
            return;
        }

        // Блокируем кнопку и показываем спиннеры
        btn.disabled = true;
        btn.textContent = "Обработка...";
        
        if (inputQ) {
            spinQ.style.display = 'inline-block';
            outQ.textContent = "Генерация ответа...";
        }
        if (inputD) {
            spinD.style.display = 'inline-block';
            outD.textContent = "Генерация ответа...";
        }

        // СИМУЛЯЦИЯ ЗАПРОСА (ЗДЕСЬ БУДЕТ РЕАЛЬНЫЙ ВЫЗОВ API)
        // Так как у нас нет бэкенда, мы имитируем задержку и ответ
        
        setTimeout(() => {
            if (inputQ) {
                spinQ.style.display = 'none';
                outQ.textContent = `[Qwen Demo]:\nПолучен ваш запрос: "${inputQ}"\n\n(Для реальной работы нужно подключить API ключ Qwen в коде)`;
            }
            if (inputD) {
                spinD.style.display = 'none';
                outD.textContent = `[DeepSeek Demo]:\nПолучен ваш запрос: "${inputD}"\n\n(Для реальной работы нужно подключить API ключ DeepSeek в коде)`;
            }
            
            btn.disabled = false;
            btn.textContent = "Отправить обоим моделям";
        }, 2000);
    }

    // Отправка по Enter
    document.getElementById('inputQwen').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendRequests();
        }
    });
    document.getElementById('inputDeepSeek').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendRequests();
        }
    });
</script>

</body>
</html>
